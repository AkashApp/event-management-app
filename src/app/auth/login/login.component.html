<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="main-container">
  <mat-card class="full-width">
    <mat-card-title>Login</mat-card-title>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required />
      <mat-error
        *ngIf="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
      >
        Valid email required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" required />
      <mat-error
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
      >
        Password is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" class="submit-button">Login</button>

    <mat-error *ngIf="error">{{ error }}</mat-error>
    <p class="register-link">Dont have an account? <a routerLink="/auth/register">Register</a></p>
  </mat-card>
</form>
